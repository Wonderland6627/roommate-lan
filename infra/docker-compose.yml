services:
  headscale:
    image: ${HEADSCALE_IMAGE:-headscale/headscale:0.23.0}
    container_name: roommate-headscale
    command: serve
    restart: unless-stopped
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - ./headscale/derp.yaml:/etc/headscale/derp.yaml:ro
      - ./headscale/acl.hujson:/etc/headscale/acl.hujson:ro
      - headscale-data:/var/lib/headscale
      - headscale-run:/var/run/headscale
    expose:
      - "8080"
      - "9090"
    networks:
      - roommate-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  room-api:
    build: ./room-api
    container_name: roommate-room-api
    restart: unless-stopped
    environment:
      LOGIN_SERVER: https://${HS_DOMAIN}
      HEADSCALE_API_URL: http://headscale:8080
      HEADSCALE_API_KEY: ${HEADSCALE_API_KEY:-}
      HEADSCALE_USER: ${HEADSCALE_USER:-roommate}
      ROOM_TTL_HOURS: ${ROOM_TTL_HOURS:-4}
      AUTHKEY_TTL_HOURS: ${AUTHKEY_TTL_HOURS:-2}
      DATA_DIR: /data
      LOG_DIR: ${LOG_DIR:-/data/logs}
      LOG_RETAIN_DAYS: ${LOG_RETAIN_DAYS:-14}
      MOCK_AUTH_KEY: ${MOCK_AUTH_KEY:-}
      GEOIP_DB_PATH: ${GEOIP_DB_PATH:-/geoip/city.mmdb}
    volumes:
      - room-api-data:/data
      - ./logs:/data/logs
      - ./geoip:/geoip:ro
    depends_on:
      - headscale
    expose:
      - "8081"
    networks:
      - roommate-net

  caddy:
    image: caddy:2.8-alpine
    container_name: roommate-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      HS_DOMAIN: ${HS_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - headscale
      - room-api
    networks:
      - roommate-net

  # DERP listens on host 8443 (HTTPS) + 3478/UDP (STUN) so it does not
  # conflict with Caddy on 443. Point derp.yaml derpport at 8443, or put
  # DERP on a second IP / SNI passthrough if you need 443 for DERP.
  # 使用 Docker Hub 镜像；官方 ghcr.io/tailscale/derper 在国内常报 denied
  derper:
    image: ${DERPER_IMAGE:-fredliang/derper:latest}
    container_name: roommate-derper
    restart: unless-stopped
    environment:
      DERP_DOMAIN: ${DERP_DOMAIN}
      DERP_CERT_MODE: manual
      DERP_CERT_DIR: /app/certs
      DERP_ADDR: ":443"
      DERP_HTTP_PORT: "-1"
      DERP_STUN: "true"
      DERP_STUN_PORT: "3478"
      DERP_VERIFY_CLIENTS: "false"
    volumes:
      - ./derper/certs:/app/certs:ro
    ports:
      - "8443:443"
      - "3478:3478/udp"
    networks:
      - roommate-net

volumes:
  headscale-data:
  headscale-run:
  room-api-data:
  caddy-data:
  caddy-config:

networks:
  roommate-net:
    driver: bridge
